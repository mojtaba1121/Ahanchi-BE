name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate Docker Compose
        env:
          JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
          SEED_ADMIN_PHONE: '09000000000'
          SEED_ADMIN_PASSWORD: ci-only-admin-password
        run: docker compose config --quiet
      - run: docker build -t ahanchi-backend:ci .
